; ==========================================
; TriQuest Interactive Horror Survival Outbreak
; DefaultScalability.ini — Optimized for UE5 Lumen + VSM
; ==========================================

[ScalabilitySettings]
PerfIndexThresholds_ResolutionQuality=25 50 75
PerfIndexThresholds_ViewDistanceQuality=25 50 75
PerfIndexThresholds_AntiAliasingQuality=25 50 75
PerfIndexThresholds_ShadowQuality=25 50 75
PerfIndexThresholds_PostProcessQuality=25 50 75
PerfIndexThresholds_TextureQuality=25 50 75
PerfIndexThresholds_EffectsQuality=25 50 75
PerfIndexThresholds_FoliageQuality=25 50 75

; ------------------------------------------------------------
; 🔥 EPIC QUALITY — Cinematic Horror Look (PC / Next Gen)
; ------------------------------------------------------------
[ViewDistanceQuality@3]
r.ViewDistanceScale=1.0

[AntiAliasingQuality@3]
r.PostProcessAAQuality=6
r.TemporalAA.Upsampling=1
r.TemporalAA.Algorithm=1
r.TemporalAA.Sharpness=0.6

[ShadowQuality@3]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ForceOnlyVirtualShadowMaps=1
r.Shadow.RadiusThreshold=0.04
r.Shadow.Virtual.Clipmap.LastLevel=15
r.Shadow.Virtual.Cache.MaxMaterialPositionInvalidationRadius=3600
r.Shadow.Virtual.ResolutionLodBiasDirectional=-1.1
r.Shadow.Virtual.UseFarShadowCulling=0.1
r.Shadow.CSM.TransitionScale=1.0
r.Shadow.CSM.MaxCascades=4

[PostProcessQuality@3]
r.EyeAdaptationQuality=2
r.BloomQuality=4
r.LensFlareQuality=2
r.DepthOfFieldQuality=3
r.MotionBlurQuality=2
r.AmbientOcclusionLevels=3
r.AmbientOcclusionQuality=2
r.FilmGrain=1
r.Tonemapper.Sharpen=0.6

[TextureQuality@3]
r.Streaming.PoolSize=4096
r.MaxAnisotropy=8
r.Streaming.MipBias=0

[EffectsQuality@3]
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=128
r.LightFunctionQuality=1
r.TranslucencyVolumeBlur=1
r.TranslucencyLightingVolumeDim=64

[FoliageQuality@3]
foliage.LODDistanceScale=2.0
foliage.DensityScale=1.0

; ------------------------------------------------------------
; 💡 LUMEN SETTINGS — Cinematic but balanced
; ------------------------------------------------------------
[/Script/Engine.RendererSettings]
r.Lumen.Reflections.DownsampleFactor=1.85
r.Lumen.ScreenProbeGather.Temporal.DistanceThreshold=1.65
r.Lumen.ScreenProbeGather.MaxRayIntensity=8
r.Lumen.Reflections.HierarchicalScreenTraces.MaxIterations=4
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.Reflections.Allow=1
r.Lumen.HardwareRayTracing=1
r.RayTracing.NormalBias=5.0
r.RayTracing.Shadows=1
r.Lumen.Reflections.ScreenTraces=1

; ------------------------------------------------------------
; ⚙️ Performance Tweaks
; ------------------------------------------------------------
r.SceneColorFringeQuality=0
r.MotionBlurQuality=2
r.SecondaryScreenPercentage.GameViewport=100
r.ScreenPercentage=100
r.SkyAtmosphere.FastSkyLUT=1
r.HZBOcclusion=1
r.TemporalAAFilterSize=0.5
r.SSR.Quality=2
r.SSR.MaxRoughness=0.7
r.ContactShadows=1

; ------------------------------------------------------------
; 🚀 Recommended default scalability (Epic)
; ------------------------------------------------------------
[/Script/Engine.GameUserSettings]
bUseDynamicResolution=False
ScalabilityLevel=3
ResolutionQuality=100.000000
ViewDistanceQuality=3
AntiAliasingQuality=3
ShadowQuality=3
PostProcessQuality=3
TextureQuality=3
EffectsQuality=3
FoliageQuality=3
